<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Art &amp; More Links</title>
<meta name="description" content="Art &amp; More, a handmade atelier in Cairo. Website, Instagram, Facebook and TikTok.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Jost:wght@400;500;600&family=Cairo:wght@400;600&display=swap">
<style>
/* Layout: tonal logo-pattern band on top, logo card overlapping it, then four link rows. */
:root{
  --navy:#000766; --gold:#FED513; --ivory:#FFFEF3;
  --bg:#FFFEF3; --fg:#0b0f3a; --muted:#4f5480; --card:#ffffff; --line:#e6e3cf; --accent:#000766; --accent-fg:#FFFEF3;
  --display:"Fraunces", Georgia, serif; --body:"Jost", "Helvetica Neue", Arial, sans-serif; --arabic:"Cairo", Tahoma, sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#05082e; --fg:#FFFEF3; --muted:#b9bbd6; --card:#0d1247; --line:#222a72; --accent:#FED513; --accent-fg:#05082e; color-scheme:dark }}
:root[data-theme="dark"]{ --bg:#05082e; --fg:#FFFEF3; --muted:#b9bbd6; --card:#0d1247; --line:#222a72; --accent:#FED513; --accent-fg:#05082e; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.5}
.band{height:150px; background:#000766 repeat; background-size:150px auto}
.wrap{max-width:460px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:0 48px; display:flex; flex-direction:column; gap:26px}
header{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; margin-top:-92px}
.logo{background:#FFFEF3; border-radius:24px; padding:18px 24px; box-shadow:0 6px 24px rgba(0,7,102,.18); line-height:0}
.logo-svg{width:130px; height:auto; display:block}
h1{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.est{font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:6px}
.tag{margin:0; color:var(--muted); max-width:34ch}
.ar{font-family:var(--arabic); direction:rtl}
.links{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
.item{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.row{display:flex; align-items:stretch}
.arrow{margin-left:auto; color:var(--muted); font-size:1.2rem}
.go{flex:1; min-width:0; display:flex; align-items:center; gap:14px; padding:14px 16px; color:inherit; text-decoration:none}
.go:hover .lbl, .go:focus-visible .lbl{text-decoration:underline; text-underline-offset:3px}
.ic{flex:none; width:42px; height:42px; border-radius:10px; display:grid; place-items:center; color:#fff}
.ic svg{width:22px; height:22px}
.txt{min-width:0; display:flex; flex-direction:column}
.lbl{font-weight:600}
.sub{font-size:.84rem; color:var(--muted); overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
footer{text-align:center; font-size:.82rem; color:var(--muted)}
</style></head><body>
